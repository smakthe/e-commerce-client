server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Use Docker's internal DNS so upstream resolution is deferred to request
    # time rather than nginx startup — prevents "host not found" on boot
    resolver 127.0.0.11 valid=10s;
    set $backend http://web:80;

    # Proxy all /api/* requests to the Rails backend.
    # The rewrite strips the /api prefix explicitly — required because proxy_pass
    # with a $variable disables nginx's automatic URI substitution, which caused
    # every request to arrive at Rails as "/" instead of the real path.
    location /api/ {
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization     $http_authorization;
        proxy_pass_header Authorization;
        proxy_read_timeout 60s;
    }

    # React SPA — every non-file route falls back to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Tight cache headers for hashed assets (Vite content-hashes all JS/CSS)
    location ~* \.(?:js|css|woff2?|ttf|eot|svg|png|jpg|jpeg|gif|ico|webp)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Never cache index.html so the browser always fetches fresh asset manifests
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}